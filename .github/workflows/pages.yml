# Builds the web version and publishes it on GitHub Pages: on every published release (the zip is also attached
# to the release), or by hand from the Actions tab ("Run workflow").
name: Web build to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # attach the zip to the release
  pages: write
  id-token: write

# one deployment at a time; a newer run replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12

      - name: Build
        run: |
          sudo apt-get install -y ninja-build
          emcmake cmake -S . -B build/web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/web

      - name: Collect site
        run: |
          mkdir site
          cd build/web
          cp sheepdog.js sheepdog.wasm sheepdog.data manifest.webmanifest icon-*.png ../../site/
          cp sheepdog.html ../../site/index.html

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site && zip -r ../sheepdog-web-${{ github.event.release.tag_name }}.zip . && cd ..
          gh release upload "${{ github.event.release.tag_name }}" sheepdog-web-*.zip --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
